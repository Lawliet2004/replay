[package]
name = "replay"
version = "0.2.0"
description = "Replay — a focused local desktop media player"
authors = ["Replay Contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-replay-media3 = { path = "plugins/replay-media3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
url = "2"
raw-window-handle = "0.6"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
resvg = { version = "0.45", default-features = false }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11 = { version = "2", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSOpenGLView", "NSWindow"] }
objc2-foundation = "0.3"

[features]
default = ["mpv"]
mpv = []
# Kept for compatibility. Linux always links libX11 (see target deps).
x11-host = []

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
