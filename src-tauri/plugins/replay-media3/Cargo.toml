[package]
name = "tauri-plugin-replay-media3"
version = "0.1.0"
description = "Android Media3/ExoPlayer backend for Replay"
edition = "2021"
license = "MIT"
links = "tauri-plugin-replay-media3"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
