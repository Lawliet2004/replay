name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_NOTES: "See THIRD_PARTY_NOTICES.md for libmpv/FFmpeg (desktop) and AndroidX Media3/ExoPlayer (Android APK) obligations."

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libappindicator3-dev librsvg2-dev patchelf libmpv-dev libx11-dev libssl-dev squashfs-tools xdg-utils || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libmpv-dev libx11-dev libssl-dev squashfs-tools xdg-utils
      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install mpv
      - name: Fetch Windows libmpv
        if: runner.os == 'Windows'
        run: |
          choco install 7zip -y
          npm ci
          npm run native:fetch
      - name: Install JS
        if: runner.os != 'Windows'
        run: npm ci
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Replay ${{ github.ref_name }}
          releaseBody: "${{ env.RELEASE_NOTES }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. See docs/android-signing.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install APK signing tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Export NDK
        run: |
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install JS
        run: npm ci
      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci --skip-targets-install
          fi
      - name: Build APK
        run: npx tauri android build --apk --target aarch64
      - name: Sign and verify release APK
        id: signed-apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*' -name '*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK; found ${#apks[@]}."
            exit 1
          fi
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -f -P 16 4 "${apks[0]}" "$signing_dir/aligned.apk"
          ASSET="$RUNNER_TEMP/Replay-${GITHUB_REF_NAME}-android-aarch64.apk"
          "$build_tools/apksigner" sign --ks "$signing_dir/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "$ASSET" "$signing_dir/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$ASSET"
          "$build_tools/zipalign" -c -P 16 4 "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Upload signed arm64 APK to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.signed-apk.outputs.path }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          NOTES="$RELEASE_NOTES"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Replay ${TAG}" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$ASSET" --clobber

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release edit "$TAG" --draft=false || true
